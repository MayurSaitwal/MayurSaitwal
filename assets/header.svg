<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Mayur Saitwal - Cloud, DevOps, Kubernetes, SRE" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.6" stop-color="#14263a"/>
      <stop offset="1" stop-color="#1b3a52"/>
    </linearGradient>

    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#36BCF7"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#FF9900"/>
    </linearGradient>

    <!-- soft two-tone name gradient, gently shifting -->
    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="420" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#7dd3fc"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="420 0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#36BCF7" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#36BCF7" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>

    <clipPath id="card"><rect x="1.5" y="1.5" width="997" height="297" rx="20"/></clipPath>
  </defs>

  <!-- self-contained card: looks the same on light and dark GitHub themes -->
  <g clip-path="url(#card)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <rect width="1000" height="300" fill="url(#dots)"/>

    <circle cx="810" cy="150" r="150" fill="url(#glow)">
      <animate attributeName="r" values="140;160;140" dur="7s" repeatCount="indefinite"/>
    </circle>

    <!-- two soft waves -->
    <path fill="#36BCF7" fill-opacity="0.08" d="M0 258 q125 -26 250 0 t250 0 t250 0 t250 0 t250 0 t250 0 L1500 300 L0 300 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="16s" repeatCount="indefinite"/>
    </path>
    <path fill="#a78bfa" fill-opacity="0.09" d="M0 272 q125 22 250 0 t250 0 t250 0 t250 0 t250 0 t250 0 L1500 300 L0 300 Z">
      <animateTransform attributeName="transform" type="translate" from="-500 0" to="0 0" dur="24s" repeatCount="indefinite"/>
    </path>

    <!-- twinkling sparkles -->
    <g fill="#ffffff">
      <path d="M0 -7 L1.6 -1.6 L7 0 L1.6 1.6 L0 7 L-1.6 1.6 L-7 0 L-1.6 -1.6 Z" transform="translate(470 56)">
        <animate attributeName="opacity" values="0.1;0.9;0.1" dur="4s" repeatCount="indefinite"/>
      </path>
      <path d="M0 -5 L1.2 -1.2 L5 0 L1.2 1.2 L0 5 L-1.2 1.2 L-5 0 L-1.2 -1.2 Z" transform="translate(620 250)">
        <animate attributeName="opacity" values="0.1;0.8;0.1" dur="5s" begin="-2s" repeatCount="indefinite"/>
      </path>
      <path d="M0 -5 L1.2 -1.2 L5 0 L1.2 1.2 L0 5 L-1.2 1.2 L-5 0 L-1.2 -1.2 Z" transform="translate(950 40)">
        <animate attributeName="opacity" values="0.1;0.8;0.1" dur="6s" begin="-1s" repeatCount="indefinite"/>
      </path>
      <path d="M0 -4 L1 -1 L4 0 L1 1 L0 4 L-1 1 L-4 0 L-1 -1 Z" transform="translate(40 40)">
        <animate attributeName="opacity" values="0.1;0.7;0.1" dur="5s" begin="-3s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- orbit system -->
    <g transform="translate(810 150)" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="600" text-anchor="middle">
      <circle r="72"  fill="none" stroke="#36BCF7" stroke-opacity="0.45" stroke-dasharray="4 6"/>
      <circle r="118" fill="none" stroke="#a78bfa" stroke-opacity="0.40" stroke-dasharray="4 8"/>

      <!-- core -->
      <circle r="38" fill="#0b1220" stroke="#36BCF7" stroke-width="2.5"/>
      <circle r="38" fill="none" stroke="#36BCF7" stroke-opacity="0.5" stroke-width="1">
        <animate attributeName="r" values="38;50;38" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.5;0;0.5" dur="4s" repeatCount="indefinite"/>
      </circle>
      <text y="6" font-size="17" fill="#f1f5f9" letter-spacing="1">AWS</text>

      <!-- inner orbit: Docker -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
        <g transform="translate(72 0)">
          <circle r="23" fill="#0b1220" stroke="#2496ED" stroke-width="2"/>
          <g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="18s" repeatCount="indefinite"/>
            <text y="4" font-size="11" fill="#e2e8f0">Docker</text></g>
        </g>
      </g>

      <!-- outer orbit: Kubernetes -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="30s" repeatCount="indefinite"/>
        <g transform="translate(118 0)">
          <circle r="23" fill="#0b1220" stroke="#326CE5" stroke-width="2"/>
          <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
            <text y="4" font-size="11" fill="#e2e8f0">K8s</text></g>
        </g>
      </g>

      <!-- outer orbit: CI/CD (opposite side) -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="540" to="180" dur="30s" repeatCount="indefinite"/>
        <g transform="translate(118 0)">
          <circle r="23" fill="#0b1220" stroke="#FF9900" stroke-width="2"/>
          <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
            <text y="4" font-size="11" fill="#e2e8f0">CI/CD</text></g>
        </g>
      </g>
    </g>

    <!-- name + role -->
    <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
      <text x="60" y="108" font-size="15" fill="#94a3b8" letter-spacing="4">
        HELLO, I'M
        <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
      </text>

      <text x="56" y="180" font-size="68" font-weight="800" fill="url(#name)">
        Mayur Saitwal
        <animate attributeName="opacity" from="0" to="1" dur="1.6s" fill="freeze"/>
      </text>

      <!-- accent line with a travelling highlight -->
      <rect x="60" y="202" width="150" height="3" rx="1.5" fill="url(#border)" fill-opacity="0.9">
        <animate attributeName="width" from="0" to="150" dur="1.4s" begin="0.6s" fill="freeze"/>
      </rect>

      <!-- role chips -->
      <g font-size="15" font-weight="600" fill="#e2e8f0">
        <g>
          <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="1.0s" fill="freeze"/>
          <rect x="60" y="225" width="86" height="30" rx="15" fill="#36BCF7" fill-opacity="0.14" stroke="#36BCF7" stroke-opacity="0.7"/>
          <text x="103" y="245" text-anchor="middle">Cloud</text>
        </g>
        <g>
          <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="1.2s" fill="freeze"/>
          <rect x="156" y="225" width="96" height="30" rx="15" fill="#a78bfa" fill-opacity="0.14" stroke="#a78bfa" stroke-opacity="0.7"/>
          <text x="204" y="245" text-anchor="middle">DevOps</text>
        </g>
        <g>
          <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="1.4s" fill="freeze"/>
          <rect x="262" y="225" width="118" height="30" rx="15" fill="#326CE5" fill-opacity="0.18" stroke="#6b93f0" stroke-opacity="0.8"/>
          <text x="321" y="245" text-anchor="middle">Kubernetes</text>
        </g>
        <g>
          <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="1.6s" fill="freeze"/>
          <rect x="390" y="225" width="70" height="30" rx="15" fill="#FF9900" fill-opacity="0.14" stroke="#FF9900" stroke-opacity="0.7"/>
          <text x="425" y="245" text-anchor="middle">SRE</text>
        </g>
      </g>
    </g>

    <!-- gradient accent bar along the top edge -->
    <rect x="0" y="0" width="1000" height="3" fill="url(#border)" fill-opacity="0.85"/>
  </g>

  <!-- border visible on both white and black backgrounds -->
  <rect x="1.5" y="1.5" width="997" height="297" rx="20" fill="none" stroke="url(#border)" stroke-opacity="0.55" stroke-width="1.5"/>
</svg>
