<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Mayur Saitwal - Cloud, DevOps, Kubernetes, SRE" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#16293a"/>
      <stop offset="1" stop-color="#1f4258"/>
    </linearGradient>

    <!-- shimmering name gradient -->
    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="360" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#36BCF7"/>
      <stop offset="0.35" stop-color="#a78bfa"/>
      <stop offset="0.7" stop-color="#FF9900"/>
      <stop offset="1" stop-color="#36BCF7"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="360 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#36BCF7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#36BCF7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="300" fill="url(#bg)"/>

  <!-- soft glow behind orbit system -->
  <circle cx="810" cy="140" r="150" fill="url(#glow)">
    <animate attributeName="r" values="140;165;140" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- floating particles -->
  <g fill="#ffffff">
    <circle cx="60"  cy="300" r="2">   <animate attributeName="cy" from="310" to="-10" dur="9s"  repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="9s"  repeatCount="indefinite"/></circle>
    <circle cx="150" cy="300" r="1.5"> <animate attributeName="cy" from="310" to="-10" dur="12s" begin="-3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="12s" begin="-3s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="300" r="2.5"> <animate attributeName="cy" from="310" to="-10" dur="10s" begin="-6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="10s" begin="-6s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="300" r="1.5"> <animate attributeName="cy" from="310" to="-10" dur="14s" begin="-2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="14s" begin="-2s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="300" r="2">   <animate attributeName="cy" from="310" to="-10" dur="11s" begin="-8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="11s" begin="-8s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="300" r="1.5"> <animate attributeName="cy" from="310" to="-10" dur="13s" begin="-5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="13s" begin="-5s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="300" r="2.5"> <animate attributeName="cy" from="310" to="-10" dur="9s"  begin="-1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="9s"  begin="-1s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="300" r="2">   <animate attributeName="cy" from="310" to="-10" dur="12s" begin="-7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="12s" begin="-7s" repeatCount="indefinite"/></circle>
    <circle cx="100" cy="300" r="1.5"> <animate attributeName="cy" from="310" to="-10" dur="15s" begin="-9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="15s" begin="-9s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="300" r="1.5"> <animate attributeName="cy" from="310" to="-10" dur="10s" begin="-4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="10s" begin="-4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- moving waves -->
  <path fill="#36BCF7" fill-opacity="0.10" d="M0 255 q125 -32 250 0 t250 0 t250 0 t250 0 t250 0 t250 0 L1500 300 L0 300 Z">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="9s" repeatCount="indefinite"/>
  </path>
  <path fill="#a78bfa" fill-opacity="0.12" d="M0 270 q125 28 250 0 t250 0 t250 0 t250 0 t250 0 t250 0 L1500 300 L0 300 Z">
    <animateTransform attributeName="transform" type="translate" from="-500 0" to="0 0" dur="14s" repeatCount="indefinite"/>
  </path>

  <!-- orbit system -->
  <g transform="translate(810 140)" font-family="Segoe UI Emoji, Apple Color Emoji, Noto Color Emoji, sans-serif" text-anchor="middle">
    <circle r="72"  fill="none" stroke="#36BCF7" stroke-opacity="0.45" stroke-dasharray="4 6"/>
    <circle r="118" fill="none" stroke="#a78bfa" stroke-opacity="0.40" stroke-dasharray="4 8"/>

    <!-- core -->
    <circle r="36" fill="#0b1220" stroke="#36BCF7" stroke-width="2.5"/>
    <text y="11" font-size="32">☁️</text>

    <!-- inner orbit: Docker -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
      <g transform="translate(72 0)">
        <circle r="18" fill="#0b1220" stroke="#2496ED" stroke-width="2"/>
        <g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="10s" repeatCount="indefinite"/>
          <text y="8" font-size="21">🐳</text></g>
      </g>
    </g>

    <!-- outer orbit: Kubernetes -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite"/>
      <g transform="translate(118 0)">
        <circle r="18" fill="#0b1220" stroke="#326CE5" stroke-width="2"/>
        <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
          <text y="8" font-size="21">☸️</text></g>
      </g>
    </g>

    <!-- outer orbit: CI/CD (opposite side) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="540" to="180" dur="18s" repeatCount="indefinite"/>
      <g transform="translate(118 0)">
        <circle r="18" fill="#0b1220" stroke="#FF9900" stroke-width="2"/>
        <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
          <text y="8" font-size="21">⚙️</text></g>
      </g>
    </g>
  </g>

  <!-- name + role -->
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <text x="60" y="118" font-size="22" fill="#94a3b8" letter-spacing="3">
      HI 👋 I'M
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
    </text>

    <text x="56" y="188" font-size="70" font-weight="800" fill="url(#name)">
      Mayur Saitwal
      <animate attributeName="opacity" from="0" to="1" dur="1.6s" fill="freeze"/>
    </text>

    <text x="60" y="232" font-size="23" fill="#e2e8f0" letter-spacing="1">
      Cloud <tspan fill="#36BCF7">•</tspan> DevOps <tspan fill="#a78bfa">•</tspan> Kubernetes <tspan fill="#FF9900">•</tspan> SRE<tspan fill="#36BCF7">_<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan>
      <animate attributeName="opacity" from="0" to="1" dur="2s" fill="freeze"/>
    </text>
  </g>
</svg>
